name: Apply exact EVA services

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exact-services.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact services from user screenshots
        run: python tools/replace_services_from_exact_yandex_screens.py
      - name: Validate JavaScript
        run: node --check mobile-eva-current.js
      - name: Verify only live service files changed
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf 'index.html\nmobile-eva-current.js')"
          test "$changed" = "$expected"
      - name: Commit exact services
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html mobile-eva-current.js
          git commit -m 'Replace EVA services with exact Yandex list'
          git push
