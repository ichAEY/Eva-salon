name: Clean stale team service refs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-team-service-refs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean stale service references from team UI
        run: python tools/clean_old_service_refs_from_team.py
      - name: Validate JavaScript
        run: node --check mobile-eva-current.js
      - name: Verify only live files changed
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf 'index.html\nmobile-eva-current.js')"
          test "$changed" = "$expected"
      - name: Commit cleanup
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html mobile-eva-current.js
          git commit -m 'Remove stale service references from EVA team UI'
          git push
