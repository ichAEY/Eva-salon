name: Bump EVA review cache v2

on:
  push:
    branches: [eva-reviews-3-per-row-fix-v2]
    paths:
      - '.github/workflows/bump-review-cache-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump only review bundle cache key
        run: python tools/bump_review_cache_v2.py
      - name: Verify only index changed
        run: |
          CHANGED=$(git diff --name-only)
          test "$CHANGED" = "index.html"
      - name: Commit cache bump
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump EVA review bundle cache key'
          git push
