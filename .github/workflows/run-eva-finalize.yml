name: Finalize EVA client build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-eva-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply EVA about reviews and call fixes
        run: python tools/fix_eva_about_reviews_calls.py
      - name: Final rating and review polish
        run: python tools/polish_eva_rating_reviews.py
      - name: Fetch 15 original five-star Yandex reviews
        run: python tools/fetch_yandex_15_reviews.py
      - name: Commit corrected EVA build
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html mobile-eva-current.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add 15 five-star EVA Yandex reviews in five rows'
            git push
          fi
