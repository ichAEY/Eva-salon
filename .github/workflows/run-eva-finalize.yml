name: Finalize EVA client build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-eva-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install review fetch dependency
        run: python -m pip install --quiet requests
      - name: Apply EVA about reviews and call fixes
        run: python tools/fix_eva_about_reviews_calls.py
      - name: Final rating and review polish
        run: python tools/polish_eva_rating_reviews.py
      - name: Fetch 15 original five-star Yandex reviews
        id: fetchreviews
        continue-on-error: true
        run: python tools/fetch_yandex_15_reviews.py
      - name: Save Yandex diagnostic on failure
        if: steps.fetchreviews.outcome == 'failure'
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add yandex-fetch-debug.txt
          git commit -m 'Save Yandex review fetch diagnostic' || true
          git push
      - name: Stop if Yandex fetch failed
        if: steps.fetchreviews.outcome == 'failure'
        run: exit 1
      - name: Make all five review rows visible and bust cache
        if: steps.fetchreviews.outcome == 'success'
        run: python tools/fix_review_visibility.py
      - name: Commit corrected EVA build
        if: steps.fetchreviews.outcome == 'success'
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html mobile-eva-current.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Show five EVA review rows and bust mobile cache'
            git push
          fi
