name: Run final EVA data cleanup

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_eva_data.py'
      - '.github/workflows/run-eva-data-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply EVA data cleanup
        run: python tools/fix_eva_data.py
      - name: Commit result
        run: |
          rm -f tools/fix_eva_data.py .github/workflows/run-eva-data-fix.yml
          git config user.name tanem-template-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Clean EVA data without changing STLuxe template'
          git push
