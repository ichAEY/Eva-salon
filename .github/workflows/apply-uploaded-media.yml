name: Apply uploaded Eva media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-uploaded-media.yml'
      - 'tools/apply_uploaded_media.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply categorised uploaded media
        run: python tools/apply_uploaded_media.py
      - name: Commit result
        run: |
          git config user.name tanem-template-bot
          git config user.email actions@users.noreply.github.com
          git add mobile-stluxe-current.js index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Integrate categorised Eva salon media'
          git push

# trigger: uploaded media integration
