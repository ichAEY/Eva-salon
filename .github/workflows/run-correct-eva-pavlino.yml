name: Fix EVA About to Pavlino

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-correct-eva-pavlino.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix only stale location copy
        run: python tools/pre_fix_pavlino_hero.py
      - name: Validate mobile JavaScript
        run: node --check mobile-eva-current.js
      - name: Verify no wrong EVA location remains
        run: |
          grep -q "EVA — салон красоты в Павлино" mobile-eva-current.js
          ! grep -Eq "Мытищи|Академика Каргина|Каргина|200326329284" mobile-eva-current.js
      - name: Verify only mobile bundle changed
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "mobile-eva-current.js"
      - name: Commit fix
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile-eva-current.js
          git commit -m 'Fix EVA About location to Pavlino'
          git push
