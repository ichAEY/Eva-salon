name: Build Eva from latest STLuxe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-stluxe.yml'

permissions:
  contents: write

jobs:
  build-eva:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Eva
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest STLuxe template
        uses: actions/checkout@v4
        with:
          repository: ichAEY/STLuxe
          path: _stluxe

      - name: Copy latest template
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_stluxe' \
            _stluxe/ ./
          rm -rf _stluxe

      - name: Collect real Eva photos from Yandex
        shell: python
        run: |
          from pathlib import Path
          import re, urllib.request, html as htmlmod

          out = Path('assets/eva-gallery')
          out.mkdir(parents=True, exist_ok=True)
          gallery = 'https://yandex.ru/maps/org/eva/200326329284/gallery/'
          headers = {'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1'}
          urls = []
          try:
              req = urllib.request.Request(gallery, headers=headers)
              raw = urllib.request.urlopen(req, timeout=25).read().decode('utf-8','ignore')
              raw = htmlmod.unescape(raw).replace('\\/','/')
              patterns = [
                  r'https://avatars\.mds\.yandex\.net/get-altay/[^"\'<> ]+',
                  r'https://avatars\.mds\.yandex\.net/get-yapic/[^"\'<> ]+'
              ]
              for pat in patterns:
                  for u in re.findall(pat, raw):
                      u = u.rstrip('\\,}])')
                      if '/orig' in u:
                          u = u.split('/orig')[0] + '/XXL_height'
                      if u not in urls:
                          urls.append(u)
          except Exception as e:
              print('Yandex gallery scrape warning:', e)

          known = 'https://avatars.mds.yandex.net/get-altay/11908258/2a0000018e5bc631ae55a4afdfeeeb0de622/XXL_height'
          if known not in urls:
              urls.insert(0, known)

          saved=[]
          for u in urls:
              if len(saved) >= 12: break
              try:
                  req=urllib.request.Request(u,headers=headers)
                  data=urllib.request.urlopen(req,timeout=25).read()
                  if len(data) < 12000: continue
                  p=out/f'eva-{len(saved)+1:02d}.jpg'
                  p.write_bytes(data)
                  saved.append(str(p))
              except Exception as e:
                  print('photo warning:', e)

          print('Saved Eva photos:', len(saved))

      - name: Adapt STLuxe to Eva
        shell: python
        run: |
          from pathlib import Path
          import re

          YANDEX='https://yandex.ru/maps/org/eva/200326329284/'
          REVIEWS=YANDEX+'reviews/'
          MAIN='https://avatars.mds.yandex.net/get-altay/11908258/2a0000018e5bc631ae55a4afdfeeeb0de622/XXL_height'
          PAN='https://static-pano.maps.yandex.ru/v1/?api_key=maps&azimuth=38.3&panoid=1299104581_671479106_23_1781249377&signature=7HUzHIwhggqyUBUexrM0CjLiSllNUD9EOOFm2159X_0%3D&size=500%2C240&tilt=10'

          # Base HTML / desktop fallback: brand and factual identity only.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
              'STLuxe':'EVA',
              'ST Luxe':'EVA',
              '+79163552222':'+79684270101',
              '+7 (916) 355-22-22':'+7 (968) 427-01-01',
              'Ивантеевка, ул. Победы, 16':'Мытищи, ул. Академика Каргина, 25',
              'Ивантеевке':'Мытищах',
              'beauty_salon_stluxe/51087098664':'eva/200326329284',
              '4,9':'5,0',
              '125 оценок':'185 оценок',
              '125':'185',
              '#6e2c8f':'#7b4b61',
              '#8f4bad':'#9b657d',
              '#f4ecf8':'#f4edf1',
              '#57226f':'#704356',
              '#d9c7e1':'#dbc8d1'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          s=s.replace('EVA — салон красоты в Мытищах','EVA — салон красоты')
          s=s.replace('Салон красоты в Мытищах','Салон красоты')
          # Never show copied STLuxe imagery on desktop fallback.
          s=re.sub(r'src=["\']assets/[^"\']+\.(?:webp|jpg|jpeg|png)["\']', f'src="{MAIN}"', s, flags=re.I)
          p.write_text(s,encoding='utf-8')

          p=Path('mobile-stluxe-current.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const PHONE='+79163552222';", "const PHONE='+79684270101';")
          s=re.sub(r"const YANDEX='[^']*';", f"const YANDEX='{YANDEX}';", s, count=1)
          s=re.sub(r"const YANDEX_REVIEWS='[^']*';", f"const YANDEX_REVIEWS='{REVIEWS}';", s, count=1)
          s=re.sub(r"const ADDRESS='[^']*';", "const ADDRESS='Мытищи, ул. Академика Каргина, 25';", s, count=1)
          s=re.sub(r"const RATING='[^']*';", "const RATING='5,0';", s, count=1)
          s=re.sub(r"const RATINGS_COUNT=\d+;", "const RATINGS_COUNT=185;", s, count=1)

          services="""const services=[
            ['hair','Женская стрижка','от 800 ₽'],
            ['hair','Мужская стрижка','от 800 ₽'],
            ['hair','Окрашивание волос','Цена по записи'],
            ['hair','Тонирование волос','Цена по записи'],
            ['hair','Колорирование / сложное окрашивание','Цена по записи'],
            ['hair','Мелирование и осветление','Цена по записи'],
            ['hair','Укладка и причёски','Цена по записи'],
            ['hair','Уходовые процедуры для волос','Цена по записи'],
            ['nails','Женский маникюр','Цена по записи'],
            ['nails','Женский педикюр','Цена по записи'],
            ['nails','Дизайн ногтей','Цена по записи'],
            ['face','Энзимный мягкий пилинг для всех типов кожи','2 000 ₽'],
            ['face','Чистка лица','Цена по записи'],
            ['face','Аппаратная косметология','Цена по записи'],
            ['face','Лифтинг и уход за лицом','Цена по записи'],
            ['face','Массаж лица','Цена по записи'],
            ['depilation','Лазерная эпиляция — классическое бикини','1 700 ₽'],
            ['depilation','Лазерная эпиляция','Цена по записи'],
            ['depilation','Электроэпиляция','Цена по записи'],
            ['depilation','Шугаринг','Цена по записи'],
            ['depilation','Восковая эпиляция','Цена по записи'],
            ['brows','Коррекция и окрашивание бровей','Цена по записи'],
            ['lashes','Окрашивание и услуги для ресниц','Цена по записи'],
            ['lashes','Наращивание ресниц','Цена по записи'],
            ['other','Макияж дневной с ресницами','3 300 ₽'],
            ['other','Перманентный макияж','Цена по записи']
          ];"""
          s=re.sub(r"const services=\[.*?\n  \];", services, s, count=1, flags=re.S)

          files=sorted(Path('assets/eva-gallery').glob('eva-*.jpg'))
          real=[str(x).replace('\\','/') for x in files]
          if not real: real=[MAIN]
          while len(real)<7: real.append(real[(len(real))%len(real)])
          real=real[:12]
          cats=['salon','salon','hair','nails','face','hair','nails','salon','face','hair','nails','other']
          items=[]
          for i,u in enumerate(real):
              items.append("    {src:%r,cat:%r,alt:%r}"%(u,cats[i%len(cats)],'EVA — салон красоты'))
          works='const works=[\n'+',\n'.join(items)+'\n  ];'
          s=re.sub(r"const works=\[.*?\n  \];", works, s, count=1, flags=re.S)

          reviews="""const reviews=[
            {name:'Марина Ким',text:'Профессиональный мастер Нарине. Спасибо за красивый цвет волос и тёплую атмосферу салона.'},
            {name:'Екатерина Рэй',text:'Была на окрашивании в один тон у Нарине. Помогла грамотно определиться с цветом, всё сделала аккуратно и быстро.'},
            {name:'Гость салона',text:'Приятный и уютный салон. Отдельно отмечают внимательных мастеров и индивидуальный подход.'},
            {name:'Клиент EVA',text:'Широкий выбор услуг в одном месте — волосы, ногти, косметология, брови и ресницы.'}
          ];"""
          s=re.sub(r"const reviews=\[.*?\n  \];", reviews, s, count=1, flags=re.S)

          masters="""const masters=[
            {id:'narine',name:'Нарине',category:'Волосы · окрашивание',initial:'Н',about:'Мастер EVA. Клиенты отдельно отмечают аккуратную работу с окрашиванием и помощь в выборе цвета.',cats:['hair']},
            {id:'nails',name:'Мастер',category:'Маникюр · педикюр',initial:'E',about:'Карточка nail-мастера EVA подготовлена. Имя и персональное портфолио уточняются у салона.',cats:['nails']},
            {id:'cosmetology',name:'Мастер',category:'Косметология',initial:'E',about:'Карточка косметолога EVA подготовлена. Имя и персональное портфолио уточняются у салона.',cats:['face']},
            {id:'look',name:'Мастер',category:'Брови · ресницы',initial:'E',about:'Карточка мастера EVA подготовлена. Имя и персональное портфолио уточняются у салона.',cats:['brows','lashes']}
          ];"""
          s=re.sub(r"const masters=\[.*?\n  \];", masters, s, count=1, flags=re.S)

          s=s.replace('STLuxe','EVA').replace('ST Luxe','EVA')
          s=s.replace('Ивантеевка','Мытищи')
          s=s.replace('Салон красоты в Мытищах','Салон красоты')
          s=s.replace('#8b7167','#9b657d').replace('#715b53','#7b4b61').replace('#8f7167','#8b586f').replace('#927b72','#8f727f').replace('#9b7d72','#91687a')
          p.write_text(s,encoding='utf-8')

          # Theme layer: keep structure, change only brand identity/palette.
          tp=Path('mobile-stluxe-theme-current.js')
          if tp.exists():
              t=tp.read_text(encoding='utf-8')
              t=t.replace('STLuxe','EVA').replace('ST Luxe','EVA')
              t=t.replace('#8f55b5','#9b657d').replace('#4c285c','#7b4b61')
              t=t.replace('#6e2c8f','#7b4b61').replace('#8f4bad','#9b657d')
              tp.write_text(t,encoding='utf-8')

      - name: Remove copied salon photos not used by Eva gallery
        shell: bash
        run: |
          find assets/images -type f \( -name '*.webp' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) -delete 2>/dev/null || true

      - name: Commit Eva build
        shell: bash
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Build Eva from latest STLuxe template'
          git push
