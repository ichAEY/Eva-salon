name: EVA transparent hero header
# fix actual overlay + cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eva-transparent-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Put transparent header over hero photo
        run: |
          python - <<'PY'
          from pathlib import Path

          theme=Path('mobile-eva-theme-current.js')
          s=theme.read_text(encoding='utf-8')
          old='.tn22-top{background:transparent!important}'
          new='.tn22-top{background:transparent!important}\n.tn22-media{top:0!important;height:424px!important}'
          if old not in s:
              raise SystemExit('Transparent header rule not found; refusing broad edit')
          if '.tn22-media{top:0!important;height:424px!important}' not in s:
              s=s.replace(old,new,1)
          theme.write_text(s,encoding='utf-8')

          index=Path('index.html')
          h=index.read_text(encoding='utf-8')
          old_src='mobile-eva-theme-current.js?v=20260902-pavlino-correct'
          new_src='mobile-eva-theme-current.js?v=20260903-transparent-header-overlay'
          if old_src not in h:
              raise SystemExit('Expected old theme cache version not found')
          h=h.replace(old_src,new_src,1)
          index.write_text(h,encoding='utf-8')
          print('overlay + cache bust patched')
          PY
      - name: Validate JavaScript
        run: |
          node --check mobile-eva-theme-current.js
          node --check mobile-eva-current.js
      - name: Verify exact change
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf 'index.html\nmobile-eva-theme-current.js')"
          test "$changed" = "$expected"
          grep -Fq '.tn22-top{background:transparent!important}' mobile-eva-theme-current.js
          grep -Fq '.tn22-media{top:0!important;height:424px!important}' mobile-eva-theme-current.js
          grep -Fq 'mobile-eva-theme-current.js?v=20260903-transparent-header-overlay' index.html
      - name: Commit
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html mobile-eva-theme-current.js
          git commit -m 'Fix EVA transparent header overlay and cache'
          git push
