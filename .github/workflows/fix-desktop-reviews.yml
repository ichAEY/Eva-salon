name: Fix EVA desktop reviews 5x3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-desktop-reviews.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch desktop reviews only
        run: python tools/fix_desktop_reviews_5x3.py
      - name: Verify only index changed
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "index.html"
      - name: Commit desktop reviews
        run: |
          git config user.name 'tanem-template-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix EVA desktop reviews to 5 rows of 3'
          git push
